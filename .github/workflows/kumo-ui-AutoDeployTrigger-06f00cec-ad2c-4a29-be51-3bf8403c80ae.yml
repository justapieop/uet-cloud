name: Trigger auto deployment for kumo-ui

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/kumo-ui-AutoDeployTrigger-06f00cec-ad2c-4a29-be51-3bf8403c80ae.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.KUMOUI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.KUMOUI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.KUMOUI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: apps/web/Dockerfile
          registryUrl: kumoreg.azurecr.io
          registryUsername: ${{ secrets.KUMOUI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.KUMOUI_REGISTRY_PASSWORD }}
          containerAppName: kumo-ui
          resourceGroup: kumo-rg
          imageToBuild: kumoreg.azurecr.io/kumo-ui:${{ github.sha }}
          targetPort: 3000


