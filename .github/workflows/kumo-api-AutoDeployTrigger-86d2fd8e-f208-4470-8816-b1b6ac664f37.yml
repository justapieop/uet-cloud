name: Trigger auto deployment for kumo-api

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish the current deployment before starting another one.
concurrency:
  group: kumo-api-autodeploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          KUMOAPI_AZURE_CLIENT_ID: ${{ secrets.KUMOAPI_AZURE_CLIENT_ID }}
          KUMOAPI_AZURE_TENANT_ID: ${{ secrets.KUMOAPI_AZURE_TENANT_ID }}
          KUMOAPI_AZURE_SUBSCRIPTION_ID: ${{ secrets.KUMOAPI_AZURE_SUBSCRIPTION_ID }}
          KUMOAPI_REGISTRY_URL: ${{ secrets.KUMOAPI_REGISTRY_URL }}
          KUMOAPI_REGISTRY_USERNAME: ${{ secrets.KUMOAPI_REGISTRY_USERNAME }}
          KUMOAPI_REGISTRY_PASSWORD: ${{ secrets.KUMOAPI_REGISTRY_PASSWORD }}
          KUMOAPI_CONTAINER_APP_NAME: ${{ secrets.KUMOAPI_CONTAINER_APP_NAME }}
          KUMOAPI_RG_NAME: ${{ secrets.KUMOAPI_RG_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          for setting in \
            KUMOAPI_AZURE_CLIENT_ID KUMOAPI_AZURE_TENANT_ID KUMOAPI_AZURE_SUBSCRIPTION_ID \
            KUMOAPI_REGISTRY_URL KUMOAPI_REGISTRY_USERNAME KUMOAPI_REGISTRY_PASSWORD \
            KUMOAPI_CONTAINER_APP_NAME KUMOAPI_RG_NAME; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing required GitHub secret: $setting"
              exit 1
            fi
          done
          if [[ ! "$KUMOAPI_REGISTRY_URL" =~ ^[a-zA-Z0-9.-]+$ ]]; then
            echo "::error::KUMOAPI_REGISTRY_URL must be a registry hostname without a scheme, path, or trailing slash."
            exit 1
          fi
          test -f apps/api/Dockerfile

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.KUMOAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.KUMOAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.KUMOAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Verify existing Container App
        env:
          CONTAINER_APP_NAME: ${{ secrets.KUMOAPI_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ secrets.KUMOAPI_RG_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes --only-show-errors
          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --output none --only-show-errors
          mode="$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.activeRevisionsMode --output tsv --only-show-errors)"
          if [[ "$mode" != "Single" ]]; then
            echo "::error::Select Single revision mode on the existing API app for readiness-gated automatic traffic switching."
            exit 1
          fi

      - name: Sign in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.KUMOAPI_REGISTRY_URL }}
          username: ${{ secrets.KUMOAPI_REGISTRY_USERNAME }}
          password: ${{ secrets.KUMOAPI_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push apps/api/Dockerfile
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.KUMOAPI_REGISTRY_URL }}/${{ secrets.KUMOAPI_CONTAINER_APP_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=kumo-api
          cache-to: type=gha,mode=max,scope=kumo-api

      - name: Update existing API image and wait for readiness
        env:
          CONTAINER_APP_NAME: ${{ secrets.KUMOAPI_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ secrets.KUMOAPI_RG_NAME }}
          REGISTRY_URL: ${{ secrets.KUMOAPI_REGISTRY_URL }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::The image build did not return a valid published digest."
            exit 1
          fi
          container="$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query 'properties.template.containers[].name' --output json --only-show-errors |
            jq -er --arg name "$CONTAINER_APP_NAME" \
              'if index($name) != null then $name elif length == 1 then .[0] else error("Cannot identify the API container among multiple containers") end')"
          image="$REGISTRY_URL/$CONTAINER_APP_NAME@$IMAGE_DIGEST"
          suffix="gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          revision="$CONTAINER_APP_NAME--$suffix"

          # Image-only update: never use `containerapp up` or create environments/workspaces.
          az containerapp update \
            --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --container-name "$container" --image "$image" --revision-suffix "$suffix" \
            --no-wait --output none --only-show-errors

          for ((attempt = 0; attempt < 60; attempt++)); do
            ready="$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query properties.latestReadyRevisionName --output tsv --only-show-errors)"
            if [[ "$ready" == "$revision" ]]; then
              echo 'API revision is ready.'
              exit 0
            fi
            state="$(az containerapp revision list --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "[?name=='$revision'].properties.provisioningState | [0]" --output tsv --only-show-errors)"
            if [[ "$state" == "Failed" || "$state" == "ProvisioningFailed" || "$state" == "Deprovisioned" ]]; then
              echo "::error::The new API revision failed. Inspect its system and application logs."
              exit 1
            fi
            sleep 10
          done
          echo "::error::The new API revision did not become ready within 10 minutes. Inspect its probes and startup logs."
          exit 1


