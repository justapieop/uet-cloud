name: Trigger auto deployment for kumo-ja-web

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/kumo-ja-web-AutoDeployTrigger-3e203a09-b988-422f-9e14-d48fc6e92ee8.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.KUMOJAWEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.KUMOJAWEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.KUMOJAWEB_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: apps/web/Dockerfile
          registryUrl: kumojareg.azurecr.io
          registryUsername: ${{ secrets.KUMOJAWEB_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.KUMOJAWEB_REGISTRY_PASSWORD }}
          containerAppName: kumo-ja-web
          resourceGroup: kumo-ja-rg
          imageToBuild: kumojareg.azurecr.io/kumo-ja-web:${{ github.sha }}


