name: Trigger auto deployment for kumo-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/kumo-api-AutoDeployTrigger-bd49aca2-d2ab-40d7-b1ce-71af38c470bb.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.KUMOAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.KUMOAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.KUMOAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          # COPY sources are relative to the monorepo root, not apps/api.
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: apps/api/Dockerfile
          registryUrl: kumoreg.azurecr.io
          registryUsername: ${{ secrets.KUMOAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.KUMOAPI_REGISTRY_PASSWORD }}
          containerAppName: kumo-api
          resourceGroup: kumo-rg
          imageToBuild: kumoreg.azurecr.io/kumo-api:${{ github.sha }}


